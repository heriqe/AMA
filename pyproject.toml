[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ama-autonomous-money-ai"
version = "0.1.0"
description = "Autonomous Money AI — experimental cognitive core and neural architecture research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All rights reserved" }
authors = [{ name = "AMA contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
